<div class="my-8">
  <div class="relative overflow-hidden border border-[var(--border)] bg-[var(--panel)]">

    <div *ngIf="hasError"
         class="h-64 flex items-center justify-center text-sm text-red-400">
      Failed to load image
    </div>

    <img
      *ngIf="!hasError"
      [src]="imageUrl"
      [alt]="filePath"
      (error)="onError()"
      class="w-full h-auto"
    />

  </div>

  <p class="text-sm text-center text-gray-400 mt-3 break-words">
    {{ filePath }}
  </p>

</div>
