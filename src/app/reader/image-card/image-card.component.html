<div class="my-8">
  <div class="relative rounded-2xl overflow-hidden border border-[var(--border)] bg-[var(--panel)] shadow-sm">

    <div *ngIf="hasError"
         class="h-64 flex items-center justify-center text-sm text-red-400">
      Failed to load image
    </div>

    <img
      *ngIf="!hasError"
      [src]="imageUrl"
      [alt]="filePath"
      (error)="onError()"
      class="w-full h-auto transition-opacity duration-300"
    />

  </div>

  <p class="text-sm text-center text-gray-400 mt-3 break-words">
    {{ filePath }}
  </p>

</div>
