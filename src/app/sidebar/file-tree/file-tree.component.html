<div class="pl-2 w-full">
  <div *ngFor="let node of nodes" class="w-full">

    <!-- File -->
    <div *ngIf="node.type === 'file'" class="px-3 py-1 cursor-pointer transition
                hover:bg-[var(--accent-soft)] select-none" (click)="displayFileContent(node.path)">
      • {{ node.name }}
    </div>

    <!-- Folder -->
    <div *ngIf="node.type === 'folder'" class="px-1 py-1 font-semibold cursor-pointer select-none flex flex-row items-center gap-1.5"
      (click)="toggleFolder(node)">

      <!-- Chevron -->
      <svg [class.rotate-0]="node.collapsed" [class.rotate-90]="!node.collapsed"
        class="shrink-0 transition-transform duration-150" width="12" height="12" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <span class="text-gray-500 text-sm font-medium text-[var(--text-secondary)]">{{ node.name }}</span>
    </div>

    <!-- Children -->
    <app-file-tree *ngIf="node.type === 'folder' && !node.collapsed && node.children" [nodes]="node.children">
    </app-file-tree>
  </div>
</div>
